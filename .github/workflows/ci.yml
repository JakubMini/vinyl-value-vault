name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Types, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - name: Build the dashboard and the Worker
        run: npm run build
      - name: Validate the build is deployable
        run: npx wrangler deploy --dry-run
